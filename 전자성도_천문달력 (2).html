<html lang="ko"><head><meta charset="utf-8">

<title>전자성도</title>
<style>
:root{--pn:rgba(255,255,255,.93);--tx:#14182a;--ac:#2b6cff;--bd:#c9d0e0;--chip:#eef1f8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--pn:rgba(14,20,42,.93);--tx:#e6ebff;--ac:#7aa2ff;--bd:#2a3558;--chip:#1b2547}}
:root[data-theme="dark"]{--pn:rgba(14,20,42,.93);--tx:#e6ebff;--ac:#7aa2ff;--bd:#2a3558;--chip:#1b2547}
html{height:100%}
body{height:100%;margin:0;background:#050914;font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;overflow:hidden;color:var(--tx)}
#c{position:fixed;inset:0;width:100vw;height:100dvh;min-height:100%;touch-action:none;display:block;z-index:0}
#info{z-index:2}
#panel{z-index:3}
#error{position:fixed;z-index:10;left:12px;right:12px;top:70px;padding:12px;border-radius:10px;background:#7f1d1d;color:#fff;font:13px/1.45 system-ui,sans-serif;white-space:pre-wrap;display:none}
#info{position:absolute;left:10px;right:10px;top:calc(env(safe-area-inset-top,0px) + 8px);font-size:13px;line-height:1.45;color:#cfd9ff;pointer-events:none;text-shadow:0 1px 3px #000}
#info b{color:#fff;font-size:15px}
#panel{position:absolute;left:8px;right:8px;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);background:var(--pn);border:1px solid var(--bd);border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:6px;max-width:560px;margin:0 auto;font-size:13px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--bd);background:var(--chip);color:var(--tx);border-radius:999px;padding:6px 11px;font-size:13px;cursor:pointer}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
input{background:var(--chip);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:5px 7px;font-size:13px;min-width:0}
label{display:flex;align-items:center;gap:4px}
#lat,#lon{width:64px}
input[type=range]{width:120px;padding:0}

#calendar-btn{position:fixed;right:14px;top:calc(env(safe-area-inset-top,0px) + 58px);z-index:30;box-shadow:0 4px 18px #0008;background:#2458d8;color:#fff;border:1px solid #8daeff;border-radius:999px;padding:11px 16px;font-weight:700;font-size:14px;cursor:pointer}
#cal-overlay{position:fixed;inset:0;z-index:20;background:#030712c9;display:none;align-items:center;justify-content:center;padding:14px;backdrop-filter:blur(5px)}
#cal-overlay.open{display:flex}
#cal-window{width:min(920px,100%);max-height:min(90dvh,900px);overflow:auto;background:var(--pn);color:var(--tx);border:1px solid var(--bd);border-radius:18px;padding:16px;box-shadow:0 18px 60px #0009}

// 천문 달력: 날짜별 달 위상과 연례 유성우
(()=>{
 const overlay=$('cal-overlay'),grid=$('cal-grid'),monthLabel=$('cal-month'),detail=$('cal-detail');
 let view=new Date(),chosen=null;
 const names=['일','월','화','수','목','금','토'];
 const localDate=(y,m,d)=>new Date(y,m,d,12,0,0);
 const key=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;const esc=s=>String(s).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));
 const phaseAt=d=>({label:'',emoji:'',near:false});
 const apiEvents=new Map();let apiLoaded=false,apiLoading=false,apiError='';
 const apiStatus=$('cal-api-status');
 function dateKeyFromEvent(ev){
   const raw=ev.date||ev.datetime||ev.time||ev.instant||ev.start||ev.peak||ev.peak_time||ev.maximum;
   if(!raw)return null;
   if(typeof raw==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(raw))return raw;
   const d=new Date(raw);return Number.isNaN(d.getTime())?null:key(d);
 }
 function eventLabel(ev){
   const raw=ev.title||ev.name||ev.label||ev.description||ev.event||ev.kind||ev.type||'천문 현상';
   const kind=String(ev.kind||ev.type||'').toLowerCase();
   let label=String(raw);
   const translations={moon:'달의 위상',season:'계절 변화',opposition:'충',elongation:'최대 이각',conjunction:'합',eclipse:'식',shower:'유성우',flyby:'근지구 소행성 접근'};
   if(translations[kind]&&!/\p{L}/u.test(label))label=translations[kind];
   return label;
 }
 function addApiEvent(ev){const k=dateKeyFromEvent(ev);if(!k)return;const label=eventLabel(ev);if(!apiEvents.has(k))apiEvents.set(k,[]);if(!apiEvents.get(k).includes(label))apiEvents.get(k).push(label)}
 async function loadApiEvents(){
   if(apiLoaded||apiLoading)return;apiLoading=true;apiStatus.textContent='공개 천문 API에서 현상 정보를 불러오는 중…';
   try{
     const from=new Date();from.setHours(0,0,0,0);const to=new Date(from);to.setMonth(to.getMonth()+18);
     const fmt=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
     const url=`https://spacecatalog.org/api/v1/events?from=${encodeURIComponent(fmt(from))}&to=${encodeURIComponent(fmt(to))}&limit=500`;
     const response=await fetch(url,{headers:{Accept:'application/json'}});if(!response.ok)throw new Error(`API 응답 ${response.status}`);
     const data=await response.json();
     let list=Array.isArray(data)?data:(data.events||data.data?.events||data.results||data.data||[]);
     if(!Array.isArray(list))throw new Error('API 응답 형식을 확인할 수 없습니다.');
     list.forEach(addApiEvent);apiLoaded=true;apiError='';apiStatus.textContent=`천문 현상 정보 업데이트 완료 · ${list.length}개 항목 · ${fmt(new Date())} 기준`;
   }catch(err){apiError=String(err.message||err);apiStatus.textContent='API 정보를 가져오지 못했습니다. 인터넷 연결을 확인하고 달력을 다시 열어 주세요.';}
   finally{apiLoading=false;render();}
 }
 function events(d){return apiEvents.get(key(d))||[]}
 function render(){
   const y=view.getFullYear(),m=view.getMonth();monthLabel.textContent=`${y}년 ${m+1}월`;grid.innerHTML='';names.forEach(n=>{const e=document.createElement('div');e.className='cal-cell week';e.textContent=n;grid.append(e)});const first=localDate(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();for(let i=0;i<first;i++){const e=document.createElement('div');e.className='cal-cell';e.style.visibility='hidden';grid.append(e)}for(let day=1;day<=days;day++){const d=localDate(y,m,day),ev=events(d),e=document.createElement('button');e.type='button';e.className='cal-cell';if(key(d)===key(new Date()))e.classList.add('today');if(chosen&&key(d)===key(chosen))e.classList.add('selected');e.innerHTML=`<b>${day}</b>${ev.map(x=>`<span class="ev">${esc(x)}</span>`).join('')}`;e.addEventListener('click',()=>{chosen=d;const list=events(d);detail.innerHTML=`<b>${y}년 ${m+1}월 ${day}일 (${names[d.getDay()]})</b><br>${list.length?list.map(x=>'• '+esc(x)).join('<br>'):'API에서 제공하는 주요 현상이 없습니다.'}`;render()});grid.append(e)}
 }
 $('calendar-btn').onclick=()=>{overlay.classList.add('open');view=new Date(st.t);chosen=localDate(view.getFullYear(),view.getMonth(),view.getDate());detail.innerHTML='날짜를 선택하면 해당 날짜의 API 천문 현상을 확인할 수 있습니다.';render();loadApiEvents()};
 $('cal-close').onclick=()=>overlay.classList.remove('open');overlay.addEventListener('click',e=>{if(e.target===overlay)overlay.classList.remove('open')});$('cal-prev').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()-1,1);render();loadApiEvents()};$('cal-next').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()+1,1);render();loadApiEvents()};document.addEventListener('keydown',e=>{if(e.key==='Escape')overlay.classList.remove('open')});render();
})();
